<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link rel="stylesheet" href="Calculator.css">
  <title>Calculator</title>
  
</head>
<body>
  <div class="container"><div class="calculator">
    <input type="text" placeholder="0" id="inputBox" disabled >
  </div>
  <div>
    
    <button class="operator" style=" color:red;">C</button>
    <button class="operator" style=" color:red;" >×</button>
    <button  class="operator" >%</button>
    <button  class="operator" >/</button>
  </div>
  <div>
    <button>9</button>
    <button >8</button>
    <button >7</button>
    <button class="operator">*</button>
  </div>
  <div>
    <button >6</button>
    <button >5</button>
    <button >4</button>
    <button class="operator">-</button>
  </div>
  <div>
    <button >3</button>
    <button >2</button>
    <button >1</button>
    <button class="operator">+</button>
  </div>
  <div>
    <button >00</button>
    <button >0</button>
    <button >.</button>
    <button class="equalBtn">=</button>
  </div>
</div>

  <script src=" Calculator.js"></script>
</body>
</html>
